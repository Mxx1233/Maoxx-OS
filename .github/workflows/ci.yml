name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: postgresql+psycopg://maoxx_ci:ci_only_password_not_a_secret@localhost:5432/maoxx_ci
  DEFAULT_USER_ID: 00000000-0000-0000-0000-000000000001
  FEISHU_APP_ID: ci_only_app_id
  FEISHU_APP_SECRET: ci_only_app_secret_not_a_secret

jobs:
  quality:
    name: CI / Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install quality tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Lint Python
        run: ruff check app tests
      - name: Check Python formatting
        run: ruff format --check app tests
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_USER: maoxx_ci
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
          POSTGRES_DB: maoxx_ci
        run: |
          install -m 600 /dev/null .env
          trap 'rm -f .env' EXIT
          docker compose config --quiet

  unit-tests:
    name: CI / Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  postgres-integration:
    name: CI / PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maoxx_ci
          POSTGRES_USER: maoxx_ci
          POSTGRES_PASSWORD: ci_only_password_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maoxx_ci -d maoxx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Upgrade isolated CI database
        run: alembic upgrade head
      - name: Verify Alembic state
        run: |
          alembic heads
          alembic current
          alembic check
      - name: Run isolated PostgreSQL integration test
        env:
          RUN_DATABASE_INTEGRATION_TESTS: "1"
        run: python -m unittest tests.test_database_integration -v

  docker-build:
    name: CI / Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build local image only
        run: docker build --tag maoxx-os:ci-${{ github.sha }} .

  ci-gate:
    name: CI / Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - quality
      - unit-tests
      - postgres-integration
      - docker-build
    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_TESTS_RESULT: ${{ needs['unit-tests'].result }}
          POSTGRES_RESULT: ${{ needs['postgres-integration'].result }}
          DOCKER_RESULT: ${{ needs['docker-build'].result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$POSTGRES_RESULT" = success
          test "$DOCKER_RESULT" = success
